name: Build iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Permet de lancer la compilation manuellement depuis le site

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1. Récupère votre code source sur la machine virtuelle Mac
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installe Flutter sur le Mac virtuel
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 3. Récupère les dépendances Flutter
      - name: Install dependencies
        run: flutter pub get

      # 4. Compile l'application iOS SANS signature (Sideloadly signera ensuite
      #    avec un compte Apple gratuit).
      #    `flutter build ios` exige désormais une équipe de signature même avec
      #    --no-codesign : on génère la config Flutter puis on compile
      #    directement avec xcodebuild, signature désactivée.
      - name: Build iOS Application (unsigned)
        run: |
          flutter build ios --config-only
          (cd ios && pod install)
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/ios-unsigned CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build

      # 5. Reconditionne en IPA non signé : Sideloadly le signera sur votre
      # PC avec votre compte Apple gratuit (aucun Mac requis).
      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/ios-unsigned/Build/Products/Release-iphoneos -maxdepth 1 -name "Runner.app" | head -n 1)
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r DiPeSa-unsigned.ipa Payload

      # 6. Rend les livrables téléchargeables sur GitHub (onglet Actions)
      - name: Upload Runner artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runner-app
          path: build/ios-unsigned/Build/Products/Release-iphoneos/Runner.app

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiPeSa-unsigned-ipa
          path: DiPeSa-unsigned.ipa