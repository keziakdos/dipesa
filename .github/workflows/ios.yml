name: Build iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Permet de lancer la compilation manuellement depuis le site

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1. Récupère votre code source sur la machine virtuelle Mac
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installe Flutter sur le Mac virtuel
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 3. Récupère les dépendances Flutter
      - name: Install dependencies
        run: flutter pub get

      # 4. Compile l'application iOS (sans signature de certificat Apple)
      - name: Build iOS Application
        run: flutter build ios --release --no-codesign

      # 5. Reconditionne en IPA non signé : Sideloadly le signera sur votre
      # PC avec votre compte Apple gratuit (aucun Mac requis).
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r DiPeSa-unsigned.ipa Payload

      # 6. Rend les livrables téléchargeables sur GitHub (onglet Actions)
      - name: Upload Runner artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runner-app
          path: build/ios/iphoneos/Runner.app

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiPeSa-unsigned-ipa
          path: DiPeSa-unsigned.ipa