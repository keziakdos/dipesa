name: Build iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Permet de lancer la compilation manuellement depuis le site

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1. Récupère votre code source sur la machine virtuelle Mac
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installe Flutter sur le Mac virtuel
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 3. Récupère les dépendances Flutter
      - name: Install dependencies
        run: flutter pub get

      # 4. Projet Xcode en signature manuelle + équipe factice (CI uniquement).
      #    Avec le style Automatic, Xcode 17 tente de résoudre la signature
      #    même quand elle est désactivée. En Manual + signature interdite,
      #    aucune résolution n'est tentée. Sideloadly fera la vraie signature.
      - name: Disable Xcode signing resolution (CI only)
        run: |
          perl -pi -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = FAKE1234AB;/g' ios/Runner.xcodeproj/project.pbxproj
          grep -c "DEVELOPMENT_TEAM" ios/Runner.xcodeproj/project.pbxproj

      # 5. Génère la config Xcode Flutter SANS les contrôles de signature.
      #    (Le code source de Flutter le prouve : avec --no-codesign, aucun
      #    contrôle de certificats/équipe ne s'exécute sur ce chemin.)
      - name: Generate Flutter Xcode config (unsigned)
        run: flutter build ios --release --no-codesign --config-only

      # 6. Compile directement avec xcodebuild, signature désactivée.
      #    Sortie complète visible : en cas d'échec, c'est la vraie erreur.
      - name: Build iOS Application (unsigned)
        run: xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/ios-unsigned CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY="" build

      # 7. Reconditionne en IPA non signé : Sideloadly le signera sur votre
      # PC avec votre compte Apple gratuit (aucun Mac requis).
      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/ios-unsigned/Build/Products/Release-iphoneos -maxdepth 1 -name "Runner.app" | head -n 1)
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r DiPeSa-unsigned.ipa Payload

      # 8. Rend les livrables téléchargeables sur GitHub (onglet Actions)
      - name: Upload Runner artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runner-app
          path: build/ios-unsigned/Build/Products/Release-iphoneos/Runner.app

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiPeSa-unsigned-ipa
          path: DiPeSa-unsigned.ipa